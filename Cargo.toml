[package]
name = "eggprobe"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Find and identify the devices on your network"
license = "MIT"
repository = "https://github.com/joerao/eggprobe"
publish = false

[dependencies]
aes = "0.8.4"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
humantime = "2.4.0"
ipnet = { version = "2.12.2", features = ["serde"] }
mdns-sd = "0.21.4"
netdev = "0.46.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal", "process", "fs"] }
